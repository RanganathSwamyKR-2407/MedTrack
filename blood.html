<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Availability | MedTrack</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>

<header class="navbar">
    <a href="index.html" class="logo">
        <span class="logo-icon">✚</span>
        Med<span>Track</span>
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="hospitals.html">Hospitals</a>
        <a href="emergency.html">Emergency</a>
        <a href="ambulance.html">Ambulance</a>
        <a href="blood.html" class="active">Blood</a>
    </nav>

    <div class="nav-buttons">
        <a href="login.html" class="login-btn">Login</a>
        <a href="register.html" class="primary-btn">Register</a>
    </div>
</header>

<main class="hospital-page">
    <div class="page-title">
        <div>
            <span class="section-label">BLOOD BANK NETWORK</span>
            <h1>Blood availability</h1>
            <p>Search verified blood banks across all 8 blood groups and request smart IoT-monitored dispatch.</p>
        </div>

        <div class="page-title-actions">
            <button type="button" id="useMyLocationBlood" class="small-btn">📍 Near My Location</button>
            <a href="hospital-register.html?type=blood_bank" class="primary-btn">+ Register Blood Bank</a>
        </div>
    </div>

    <div class="search-panel" style="margin-bottom:16px;">
        <input type="text" id="bloodCityFilter" placeholder="Filter by city or blood bank name...">
        <select id="bloodAvailabilityOnly">
            <option value="false">All Stock Levels</option>
            <option value="true">Available Units Only</option>
        </select>
        <button type="button" id="searchBloodBtn" class="primary-btn">Search</button>
    </div>

    <div class="blood-selector" id="bloodGroupButtons">
        <button data-group="" class="active-group">All</button>
        <button data-group="O+">O+</button>
        <button data-group="O-">O-</button>
        <button data-group="A+">A+</button>
        <button data-group="A-">A-</button>
        <button data-group="B+">B+</button>
        <button data-group="B-">B-</button>
        <button data-group="AB+">AB+</button>
        <button data-group="AB-">AB-</button>
    </div>

    <div class="hospital-layout" style="margin-top:20px;">
        <div class="map-section blood-map-section">
            <div id="bloodMap"></div>
        </div>

        <div id="bloodResults" class="hospital-list blood-results-list"></div>
    </div>

    <!-- Request Blood Form Panel -->
    <section id="bloodRequestPanel" class="panel-card" style="margin-top:28px;display:none;">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;">
            <div>
                <span class="section-label">REQUEST BLOOD UNITS</span>
                <h2 id="reqPanelTitle">Create Blood Request</h2>
            </div>
            <button type="button" class="small-btn" onclick="closeBloodRequestForm()">✕ Close</button>
        </div>
        <div id="bloodRequestFeedback" style="display:none;margin-bottom:12px;"></div>
        <form id="bloodRequestForm" class="grid-form">
            <input type="hidden" id="reqBloodBankId">
            <div class="form-group">
                <label for="reqBloodGroup">Blood Group</label>
                <select id="reqBloodGroup" required>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </div>
            <div class="form-group">
                <label for="reqUnits">Units Requested</label>
                <input type="number" id="reqUnits" min="1" max="20" value="2" required>
            </div>
            <div class="form-group">
                <label for="reqUrgency">Urgency</label>
                <select id="reqUrgency">
                    <option value="normal">Normal</option>
                    <option value="urgent">Urgent</option>
                    <option value="critical">Critical</option>
                </select>
            </div>
            <div class="form-group">
                <label for="reqContact">Recipient Contact Phone</label>
                <input type="tel" id="reqContact" placeholder="e.g. 9822011101" required>
            </div>
            <div class="form-group">
                <label for="reqPatientRef">Ward / Patient Reference (optional)</label>
                <input type="text" id="reqPatientRef" placeholder="e.g. ICU-BED-4">
            </div>
            <div class="form-group">
                <label for="reqNotes">Clinical / Dispatch Notes</label>
                <input type="text" id="reqNotes" placeholder="Transport & handling notes">
            </div>
            <div style="grid-column:1/-1;">
                <button type="submit" class="primary-btn">Submit Blood Request</button>
            </div>
        </form>
    </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/api-client.js"></script>
<script src="js/blood-portal.js"></script>
</body>

</html>
